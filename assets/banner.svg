<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pill Gradient 1 -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <!-- Pill Gradient 2 -->
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-orbit {
        animation: rotateOrb 20s linear infinite;
        transform-origin: 600px 180px;
      }
      .float-pill-1 {
        animation: floatPill1 6s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: floatPill2 7s ease-in-out infinite alternate;
      }
      .float-pill-3 {
        animation: floatPill3 8s ease-in-out infinite alternate;
      }
      .pulse-signal {
        animation: pulseWave 3s ease-out infinite;
      }
      .code-flow {
        animation: flowDash 8s linear infinite;
      }

      @keyframes rotateOrb {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatPill1 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-12px) translateX(6px); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(14px) translateX(-8px); }
      }
      @keyframes floatPill3 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-10px) translateX(-10px); }
      }
      @keyframes pulseWave {
        0% { r: 10px; opacity: 0.8; }
        100% { r: 45px; opacity: 0; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Background Elements (Soft Dynamic Layers) -->
  <g opacity="0.45">
    <circle class="pulse-signal" cx="150" cy="80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="150" cy="80" r="6" fill="#38bdf8" />

    <circle class="pulse-signal" cx="1060" cy="280" fill="none" stroke="#c084fc" stroke-width="2" style="animation-delay: 1.5s;" />
    <circle cx="1060" cy="280" r="6" fill="#c084fc" />

    <!-- Connecting Dynamic Flow Lines in Background -->
    <path class="code-flow" d="M 80,180 Q 300,50 600,180 T 1120,180" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="10 15" opacity="0.3" />
    <path class="code-flow" d="M 80,240 Q 350,320 600,200 T 1120,120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.25" style="animation-direction: reverse;" />
  </g>

  <!-- Floating Feature Pills (Soft Background Cards) -->
  <g class="float-pill-1">
    <rect x="70" y="270" width="180" height="40" rx="20" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="95" cy="290" r="6" fill="#38bdf8" />
    <text x="115" y="295" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Instant Compute</text>
  </g>

  <g class="float-pill-2">
    <rect x="950" y="50" width="190" height="40" rx="20" fill="url(#pillGrad2)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="975" cy="70" r="6" fill="#a855f7" />
    <text x="995" y="75" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 Cloud Containers</text>
  </g>

  <g class="float-pill-3">
    <rect x="920" y="270" width="210" height="40" rx="20" fill="url(#pillGrad1)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="945" cy="290" r="6" fill="#6366f1" />
    <text x="965" y="295" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💻 Self-Hosted &amp; Open</text>
  </g>

  <!-- Floating IDE Browser Window Silhouette (Clean, unobtrusive vector) -->
  <g opacity="0.22">
    <rect x="420" y="25" width="360" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="440" cy="40" r="4" fill="#ef4444" />
    <circle cx="455" cy="40" r="4" fill="#eab308" />
    <circle cx="470" cy="40" r="4" fill="#22c55e" />
    <rect x="495" y="34" width="200" height="12" rx="4" fill="#334155" />
  </g>

  <!-- Main Content Foreground (Always Visible & Prominent) -->
  <g id="foreground">
    <!-- Cloud & Code Terminal Badges -->
    <g transform="translate(600, 75)" text-anchor="middle">
      <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
      <text y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">☁️ CLOUD DEVELOPMENT ENVIRONMENTS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0px 3px 12px rgba(0, 0, 0, 0.7))">
      Awesome Cloud IDE
    </text>

    <!-- Subtitle -->
    <text x="600" y="205" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" letter-spacing="0.2">
      Curated List of Cloud Integrated Development Environments &amp; CDE Platforms
    </text>

    <!-- Secondary Meta Description -->
    <text x="600" y="238" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Hosted SaaS Solutions • Open-Source &amp; Self-Hosted Systems • WebContainers • Remote Desktops
    </text>
  </g>

  <!-- Subtle Bottom Ambient Accent Line -->
  <rect x="350" y="342" width="500" height="2" rx="1" fill="url(#titleGradient)" opacity="0.8" />
</svg>
